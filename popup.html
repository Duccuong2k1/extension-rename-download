<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <style>
    body { width: 280px; font: 14px system-ui, sans-serif; margin: 12px; }
    label { display: block; margin-bottom: 4px; }
    input { width: 100%; box-sizing: border-box; padding: 6px; }
    button { margin-top: 8px; width: 100%; padding: 8px; }
    p { margin: 8px 0 0; }
    small { color: #666; }
  </style>
</head>
<body>
  <label for="base">Tên mong muốn</label>
  <input id="base" placeholder="vd: sanpham" autofocus>
  <small>Chọn sắp xếp (cũ nhất / mới nhất / phổ biến) trong Flow trước khi bấm.</small>
  <button id="start">Bắt đầu rename &amp; tải</button>
  <p id="status" role="status"></p>
  <script type="module" src="popup.js"></script>
</body>
</html>
