<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <style>
    :root {
      --bg: #17181c;
      --surface: #22242a;
      --line: #34363d;
      --text: #ecebf0;
      --muted: #9a9ba6;
      --accent: #a8b4ff;
      --on-accent: #15172a;
      --bad: #ff9a8f;
      color-scheme: dark;
    }
    * { box-sizing: border-box; }
    body {
      width: 320px; margin: 0; padding: 18px 18px 16px;
      background: var(--bg); color: var(--text);
      font: 14px/1.45 "Google Sans Text", "Google Sans", "Segoe UI Variable Text", system-ui, sans-serif;
    }
    h1 { margin: 0 0 14px; font-size: 16px; font-weight: 600; letter-spacing: -0.01em; }
    label { display: block; margin-bottom: 6px; color: var(--muted); font-size: 13px; }
    input {
      width: 100%; padding: 10px 12px; border-radius: 10px;
      border: 1px solid var(--line); background: var(--surface); color: var(--text);
      font: inherit; outline: none; transition: border-color .15s;
    }
    input::placeholder { color: #6c6d77; }
    input:focus-visible { border-color: var(--accent); }

    /* The memorable bit: the actual file names you will get. */
    .preview {
      margin: 12px 0 4px; padding: 10px 12px; border-radius: 10px;
      background: var(--surface); font-variant-numeric: tabular-nums;
      overflow: hidden; white-space: nowrap; text-overflow: ellipsis;
    }
    .preview b { color: var(--accent); font-weight: 600; }
    .preview span { color: var(--muted); }
    .hint { margin: 0 0 14px; color: var(--muted); font-size: 12px; }

    button {
      width: 100%; padding: 11px; border: 0; border-radius: 999px;
      background: var(--accent); color: var(--on-accent);
      font: inherit; font-weight: 600; cursor: pointer;
      transition: filter .15s, opacity .15s;
    }
    button:hover:not(:disabled) { filter: brightness(1.08); }
    button:focus-visible { outline: 2px solid var(--text); outline-offset: 2px; }
    button:disabled { opacity: .45; cursor: default; }

    .progress { margin-top: 14px; }
    .progress[hidden] { display: none; }
    progress {
      appearance: none; width: 100%; height: 6px; border: 0; border-radius: 999px;
      background: var(--surface); overflow: hidden; display: block;
    }
    progress::-webkit-progress-bar { background: var(--surface); }
    progress::-webkit-progress-value { background: var(--accent); border-radius: 999px; transition: width .2s; }
    #status { margin: 8px 0 0; font-size: 13px; font-variant-numeric: tabular-nums; }
    #status.bad { color: var(--bad); }
    @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
  </style>
</head>
<body>
  <h1>Đổi tên và tải ảnh Flow</h1>
  <label for="base">Tên file</label>
  <input id="base" placeholder="sanpham" autocomplete="off" autofocus>
  <div class="preview" id="preview" aria-live="polite"></div>
  <p class="hint">Ảnh được đánh số theo thứ tự đang hiển thị. Chọn sắp xếp trong Flow trước khi tải.</p>
  <button id="start">Tải và đổi tên</button>
  <div class="progress" id="progress" hidden>
    <progress id="bar" value="0" max="1"></progress>
  </div>
  <p id="status" role="status"></p>
  <script type="module" src="popup.js"></script>
</body>
</html>
